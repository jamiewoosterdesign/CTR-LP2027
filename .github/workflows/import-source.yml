name: Import complete CTR source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import archived project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -f package.json || { echo 'Project already imported; refusing to overwrite it.'; exit 1; }
          gh release download source-import-20261027 --repo "$GITHUB_REPOSITORY" --pattern CTR-LP2027-source.zip --dir "$RUNNER_TEMP"
          python3 - "$RUNNER_TEMP/CTR-LP2027-source.zip" <<'PY'
          import pathlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for item in archive.infolist():
                  target = pathlib.Path(item.filename.replace('\\', '/'))
                  if target.is_absolute() or '..' in target.parts or '.git' in target.parts:
                      raise RuntimeError(f'Invalid archive entry: {item.filename}')
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(item))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Commit complete project
        run: |
          git config user.name jamiewoosterdesign
          git config user.email jamiewoosterdesign@users.noreply.github.com
          git add .
          git commit -m "Import complete CTR site, translations, assets and videos"
          git push origin HEAD:main
